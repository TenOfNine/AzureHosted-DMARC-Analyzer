name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Runs the open-source gitleaks CLI directly (Apache-2.0, no license key needed) rather than
      # gitleaks/gitleaks-action, whose GitHub Action *wrapper* requires a paid GITLEAKS_LICENSE for
      # organization-owned repositories — the underlying scanner is free either way.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      # --no-git scans the checked-out file contents as of this commit, not the full repo history —
      # history was never scanned before this workflow existed, so re-flagging every past commit on
      # every run would just be permanent, unfixable noise for secrets already long rotated or, as in
      # .gitleaks.toml's one allowlisted entry, never a secret to begin with.
      - name: Scan for committed secrets
        run: gitleaks detect --source . --no-git --redact --verbose --config .gitleaks.toml

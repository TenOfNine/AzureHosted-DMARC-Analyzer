name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      # No Azure, Graph, or DNS credentials are used or needed here: every external dependency
      # (Graph client, DNS resolver) is abstracted behind an interface and swapped for an in-memory
      # fake in tests (see tests/DmarcAnalyzer.Tests/TestDoubles), so CI never touches the network.
      - name: Test
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
          retention-days: 14

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # --locked-mode fails the build if packages.lock.json drifts from the <PackageReference>
      # versions instead of silently re-resolving — a bumped/added dependency must regenerate the
      # lock file (dotnet restore --force-evaluate) and commit it alongside the csproj change.
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      # No Azure, Graph, or DNS credentials are used or needed here: every external dependency
      # (Graph client, DNS resolver) is abstracted behind an interface and swapped for an in-memory
      # fake in tests (see tests/DmarcAnalyzer.Tests/TestDoubles), so CI never touches the network.
      - name: Test
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ./test-results
          retention-days: 14

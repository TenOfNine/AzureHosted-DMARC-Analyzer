name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # --locked-mode fails the build if packages.lock.json drifts from the <PackageReference>
      # versions instead of silently re-resolving — a bumped/added dependency must regenerate the
      # lock file (dotnet restore --force-evaluate) and commit it alongside the csproj change.
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      # No Azure, Graph, or DNS credentials are used or needed here: every external dependency
      # (Graph client, DNS resolver) is abstracted behind an interface and swapped for an in-memory
      # fake in tests (see tests/DmarcAnalyzer.Tests/TestDoubles), so CI never touches the network.
      - name: Test
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results
          path: ./test-results
          retention-days: 14

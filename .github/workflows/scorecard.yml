name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 2"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Needed for OSSF's OIDC-based publishing to the public Scorecard results API/badge (this
      # repo is public — see README) and to upload results to GitHub's own code-scanning dashboard.
      security-events: write
      id-token: write
      contents: read
      issues: read
      pull-requests: read
      checks: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ossf/scorecard-action publishes only full semver tags (no floating "v2" major alias) —
      # pinning @v2 fails to resolve at all, not just a stale-version risk.
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning dashboard
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif

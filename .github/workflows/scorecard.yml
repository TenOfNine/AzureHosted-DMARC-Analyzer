name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 2"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Needed for OSSF's OIDC-based publishing to the public Scorecard results API/badge (this
      # repo is public — see README) and to upload results to GitHub's own code-scanning dashboard.
      security-events: write
      id-token: write
      contents: read
      issues: read
      pull-requests: read
      checks: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # ossf/scorecard-action publishes only full semver tags (no floating "v2" major alias) —
      # pinning @v2 fails to resolve at all, not just a stale-version risk.
      - name: Run analysis
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning dashboard
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          sarif_file: results.sarif
